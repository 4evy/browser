# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: browser

builds:
  - id: browser
    main: ./cmd/browser
    binary: browser
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - browser.example.toml

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore(\\(.+\\))?:"
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"

release:
  prerelease: auto
