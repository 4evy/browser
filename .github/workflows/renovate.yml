name: Renovate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Renovate pushes with this token as github-actions[bot]. Pull request write
# access is deliberately omitted so this workflow cannot create PRs.
permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          configurationFile: .github/renovate-config.js
          renovate-version: 43.280.2
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
