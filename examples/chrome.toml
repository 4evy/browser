# Google Chrome starter with enforced policies and shared profile preferences
# Copy to tweezle.toml and adapt application/profile paths to your installation
# Open Chrome once; chrome://version shows the profile path
# Close Chrome before applying profile preferences
#
#   tweezle config validate tweezle.toml
#   tweezle apply tweezle.toml
#   tweezle policy render tweezle.toml -o chrome-policy.json
#
# Policy options take effect only after installing the rendered system policy
# Linux: /etc/opt/chrome/policies/managed/tweezle.json
# macOS: deploy the policy values under com.google.Chrome with a configuration
# profile or managed preferences; Chrome does not read the JSON file directly
# Verify the resulting policies at chrome://policy
# The NixOS module installs its Chrome policy file automatically

[browser]
name = "Google Chrome"
executable_name = "chrome-configured"
flags = ["--no-first-run", "--no-default-browser-check"]

[browser.linux]
app_dir = "/opt/google/chrome"
launcher_name = "google-chrome"
desktop_name = "/usr/share/applications/google-chrome.desktop"
desktop_exec = "/usr/bin/google-chrome-stable"
desktop_id = "google-chrome"
icon_source = "product_logo_256.png"
# For Nix, replace these fields in your Nix configuration:
# app_dir = "${pkgs.google-chrome}/share/google/chrome"
# launcher_name = "../../../bin/google-chrome-stable"
# desktop_name = "${pkgs.google-chrome}/share/applications/google-chrome.desktop"
# desktop_exec = "${pkgs.google-chrome}/bin/google-chrome-stable"
# icon_source = "${pkgs.google-chrome}/share/icons/hicolor/256x256/apps/google-chrome.png"

[browser.paths.linux]
profile_dir = "${config_home}/google-chrome/Default"
external_extension_dirs = ["${config_home}/google-chrome/External Extensions"]

[browser.macos]
app_dir = "/Applications/Google Chrome.app"
launcher_path = "Contents/MacOS/Google Chrome"

[browser.paths.macos]
profile_dir = "${home}/Library/Application Support/Google/Chrome/Default"
external_extension_dirs = [
  "${home}/Library/Application Support/Google/Chrome/External Extensions",
]

[browser.chrome]
# Example choices; omit any policy you do not want to enforce
signin = "disabled" # disabled | enabled | forced
sync = false
metrics_reporting = false
search_suggestions = false
shopping_list = false
memory_saver = true
battery_saver = "below_threshold" # disabled | below_threshold
# password_manager = false
# default_browser_check = false
# incognito = "enabled" # enabled | disabled | forced
# safe_browsing = "standard" # disabled | standard | enhanced
# https_only = "force_balanced_enabled"

[browser.chrome.ai]
help_me_write = "disabled" # allowed | allowed_without_logging | disabled
history_search = "disabled"
create_themes = "disabled"
mode = "disabled" # allowed | disabled
local_model = "disabled" # allowed | disabled
built_in_apis = false
# GenAiDefaultSettings is cloud-only and cannot enforce a local AI default
# gemini = "disabled" # allowed | disabled; documented for macOS, not Linux

# Other official policies can be supplied by name; platform restrictions apply
# Conflicting values in named options and managed_policies are rejected
# [browser.chrome.managed_policies]
# TranslateEnabled = false

# Shared preference changes are editable and apply directly to the profile
[browser.preferences.cookies]
third_party = "block"

# Current Chrome does not support Manifest V2; use uBlock Origin Lite
# Chrome also ignores --load-extension; automatic unpacked loading is rejected
# Use store/CRX installation or load unpacked extensions manually in Chrome
# The ublock/ublock.toml example contains the shared installation recipes
