# Chromium starter and shared recipes
#
# Copy this file to browser.toml, then set the application and profile paths
# Open the installed browser once; find its Profile Path at chrome://version
# For Helium or Brave, start with helium.toml or brave.toml in this directory
# Copy individual shared recipes from here into your chosen file
#
# Only the launcher and paths below are active; optional recipes are commented
# Uncomment a recipe's TOML lines together, including its table header
# Replace hypothetical extension IDs, URLs, checksums, and Git commits first
# Each extension ID must be unique across all source types
#
# After editing, close the browser and run:
#   browser config validate browser.toml
#   browser apply browser.toml
# Launch through the generated launcher to use its flags and unpacked extensions

# --- 1. Browser and launcher --------------------------------------------------

[browser]
name = "Chromium"
# Name of the generated launcher, not the executable inside the browser bundle
executable_name = "chromium-configured"
flags = ["--no-first-run", "--no-default-browser-check"]

# Optional launcher alias and extra flags file, read on every launch
# Relative flags_file paths resolve under ${config_home}, not beside this TOML
# alias_name = "chromium-personal"
# flags_file = "chromium-flags.conf"

# Optional page-request identity, passed through Chromium's --user-agent switch
# Omit to keep the browser's own identity; extension downloads use section 5
# user_agent = "Mozilla/5.0 ExampleBrowser/1.0"

# --- 2. Platform paths --------------------------------------------------------

# Both platforms may coexist; apply selects the current one
# Linux: point app_dir at the installed bundle and match its executable name
# These example bundle paths must be adapted to your installation
[browser.linux]
app_dir = "/path/to/chromium"
launcher_name = "chrome"

# Optional desktop integration: names refer to files and Exec in the bundle
# desktop_name = "chromium.desktop"
# desktop_exec = "chromium"
# desktop_id = "chromium" # Wayland application ID and X11 startup WM class
# portal_app_id = "org.chromium.Chromium" # Match the build's compiled-in ID
# wrapper_flags = ["--ozone-platform=wayland"]
# icon_source = "product_logo_256.png" # Relative to app_dir
# icon_name = "chromium.png" # Installed icon name

[browser.paths.linux]
# Use the profile directory containing Preferences, e.g. Default or Profile 1
# This selects the profile to edit; it does not change the launcher's profile
# For Profile 1, also add "--profile-directory=Profile 1" to browser.flags
profile_dir = "${config_home}/chromium/Default"
external_extension_dirs = [
  "${config_home}/chromium/External Extensions",
]

[browser.macos]
app_dir = "/Applications/Chromium.app"
launcher_path = "Contents/MacOS/Chromium" # Relative to app_dir

[browser.paths.macos]
profile_dir = "${home}/Library/Application Support/Chromium/Default"
external_extension_dirs = [
  "${home}/Library/Application Support/Chromium/External Extensions",
]

# --- 3. Profile preferences ---------------------------------------------------

# Cookie recipe: clear most cookies on exit, keep logins on example.com, block
# tracker.example, and block third-party cookies
# Each supplied exception list replaces existing exceptions of that type
# An omitted list leaves that type alone; an empty list removes its exceptions
# In Chromium 157, third_party = "off" still blocks them in incognito

# [browser.preferences.cookies]
# default = "session_only" # allow | block | session_only
# third_party = "block" # off | block | incognito_only
# allow = ["[*.]example.com"]
# block = ["[*.]tracker.example"]
# session_only = ["[*.]temporary.example"]

# Arbitrary values: repeat the table for each preference you want to manage
# Paths in values and local_state_values address nested objects with dots
# These paths are hypothetical; use names from your browser's stored preferences
# Product settings are applied after these shared values

# [[browser.preferences.values]]
# path = "example.profile_preference"
# value = true

# Local State is shared by profiles and stored beside the profile directory
# [[browser.preferences.local_state_values]]
# path = "example.local_state_preference"
# value = 3

# Variations is also shared; its paths are literal top-level keys
# [[browser.preferences.variation_values]]
# path = "example_variation"
# value = "enabled"

# --- 4. Extension sources -----------------------------------------------------

# Choose one source per extension, then repeat that source's table as needed
# Store/update-manifest sources follow compatible releases; CRX is always pinned
# ZIP and Git sources can follow updates or pin exact content
# ZIP and Git trees must already contain manifest.json; no build step is run
# load_unpacked = true adds them to the generated launcher's --load-extension
# external_extension_dirs above must match the browser's discovery directories

# Chrome Web Store: both the update service and an entry are required
# [extensions]
# chrome_store_update_url = "https://clients2.google.com/service/update2/crx"
#
# [[extensions.chrome_store]]
# id = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
# name = "Store extension"

# Update manifest: Chromium handles downloading and updating this extension
# [[extensions.update_url]]
# id = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
# name = "Self-hosted extension"
# update_url = "https://example.test/extension/updates.xml"

# Pinned CRX: supply its extension version and the checksum of the CRX bytes
# Checksums accept SRI (shown here) or hexadecimal SHA-256
# [[extensions.crx]]
# id = "cccccccccccccccccccccccccccccccc"
# name = "Pinned CRX"
# version = "1.2.3"
# url = "https://example.test/extension-1.2.3.crx"
# sha256 = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Latest GitHub release ZIP: {tag} includes the release tag's v prefix, if any
# The matching release asset must have a usable SHA-256 digest on GitHub
# Use archive_root to select the directory containing manifest.json in the ZIP
# [[extensions.zip]]
# id = "dddddddddddddddddddddddddddddddd"
# name = "Latest release ZIP"
# update_policy = "latest"
# repository = "owner/extension"
# asset_template = "extension-{tag}.zip"
# archive_root = "extension"
# load_unpacked = true

# Pinned ZIP: any HTTP host, with no GitHub release lookup
# [[extensions.zip]]
# id = "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
# name = "Pinned ZIP"
# update_policy = "pinned"
# version = "1.2.3"
# url = "https://example.test/extension-1.2.3.zip"
# sha256 = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
# archive_root = "extension"
# load_unpacked = true

# Hosted Git: github | gitlab | codeberg | sourcehut; Git must be on PATH
# GitLab accepts nested namespaces; SourceHut uses ~owner/extension
# Pinned entries require a full commit ID; ref can help locate that commit
# Use subdirectory to select the ready-to-load extension within the checkout
# [[extensions.git]]
# id = "ffffffffffffffffffffffffffffffff"
# name = "Pinned Codeberg tree"
# provider = "codeberg"
# repository = "owner/extension"
# update_policy = "pinned"
# ref = "v1.2.3"
# commit = "0123456789abcdef0123456789abcdef01234567"
# subdirectory = "dist/extension"
# load_unpacked = true

# Generic Git: HTTPS, SSH, git://, file://, and scp-style remotes are supported
# Omit provider with url; latest follows ref or the default branch
# [[extensions.git]]
# id = "gggggggggggggggggggggggggggggggg"
# name = "Latest Git tree"
# provider = "git"
# url = "ssh://git@example.test/team/extension.git"
# update_policy = "latest"
# ref = "main"
# load_unpacked = true

# --- 5. Extension download options --------------------------------------------

# Omit this table to use automatic identity detection and the retry defaults
# Downloads query an isolated browser process with a temporary profile and no
# startup window; the normal profile is left alone
# Its native user agent is copied verbatim, including reduced/frozen tokens
# Safari/537.36 is a frozen compatibility token, not a Safari release
# The chrome_version option is the Chromium product version sent to the store,
# not an extension version; failed detection falls back to latest Stable Chrome
# Without a detected user agent, requests derive one from the available Chromium
# version, or use the configurator's identity when no version is available
# These overrides affect downloads only, independently of browser.user_agent

# [extensions.network]
# chrome_version = "152.0.7971.0" # Hypothetical override; normally omit
# user_agent = "browser-configurator/1.0" # Optional download identity override
# timeout_seconds = 60
# retry_max = 3 # Set to 0 to disable retries
# retry_wait_min_milliseconds = 200
# retry_wait_max_milliseconds = 2000
# headers = { X-Example-Header = "example-value" }

# --- 6. Extension storage -----------------------------------------------------

# JSON documents populate chrome.storage.local and chrome.storage.sync
# Files are applied in order; relative paths resolve beside this TOML file
# Copy extension-settings.json alongside your config for Dark Reader settings
# Other extensions need their own IDs and storage keys
# Add more files to the list when you need later overrides

# [extension_settings]
# files = ["extension-settings.json"]

# Optional aliases target a built-in or otherwise installed extension variant
# Storage uses the installed ID; the source extension is skipped during install
# ZIP and Git installs also discover aliases automatically from the key or path
# [browser.extension_id_aliases]
# aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa = "hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh"
